syntax = "proto3";

package inventory.v1;

service InventoryService {
  rpc GetQuantity(GetQuantityRequest) returns (GetQuantityResponse);

  rpc Reserve(ReserveRequest) returns (ReservationResponse);

  rpc Release(ReleaseRequest) returns (ReservationResponse);
}

message GetQuantityRequest {
  string product_id = 1;
}

message GetQuantityResponse {
  string product_id = 1;
  int32 available = 2;
}

message ReservationItem {
  string product_id = 1;
  int32 quantity = 2;
}

message ReserveRequest {
  string reservation_id = 1;
  repeated ReservationItem items = 2;
}

message ReleaseRequest {
  string reservation_id = 1;
}

message ReservationResponse {
  string reservation_id = 1;
  string status = 2;
}