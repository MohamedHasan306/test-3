name: ecommerce-platform

services:
  db:
    image: postgres:16-alpine
  
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
      - "5433:5432" # extra port for local tooling, in case 5432 is taken by a native Postgres install
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      INVENTORY_GRPC_URL: inventory-service:50051   
      NODE_ENV: development
      PORT: 3000
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ecommerce
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      JWT_EXPIRES_IN: 1h
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  inventory-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_dev_password
      POSTGRES_DB: inventory
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - inventory_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U inventory_user -d inventory
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  inventory-service:
    build:
      context: ../inventory-service
      dockerfile: DockerFile
    env_file:
      - ../inventory-service/.env
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_HOST: inventory-db
      DATABASE_PORT: "5432"
      DATABASE_USER: inventory_user
      DATABASE_PASSWORD: inventory_dev_password
      DATABASE_NAME: inventory
    ports:
      - "127.0.0.1:3001:3000"
      - "127.0.0.1:50051:50051"
    depends_on:
      inventory-db:
        condition: service_healthy
    

volumes:
  db_data:
  uploads_data:
  inventory_postgres_data:
